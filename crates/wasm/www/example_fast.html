<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureCV - FAST Corner Detection</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --accent: #22c55e;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin: 2rem 0;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 1.5rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 0.75rem;
            height: 100%;
        }

        .checkbox-group input {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
        }

        select,
        input[type="range"] {
            width: 100%;
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 0.5rem;
            outline: none;
        }

        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            min-height: 300px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .uploader {
            border: 2px dashed #334155;
            padding: 2rem;
            text-align: center;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }

        .uploader:hover {
            border-color: var(--primary);
            background: rgba(79, 172, 254, 0.05);
        }

        .uploader p {
            margin: 0;
            color: #94a3b8;
        }

        .metrics {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: #94a3b8;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }

        .metrics span strong {
            color: var(--primary);
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loader" class="loading">
        <p>Initializing WASM module...</p>
    </div>

    <div class="container">
        <a href="index.html" class="back-btn">
            &larr; Back to Menu
        </a>

        <div class="header">
            <h1>FAST Corner Detection</h1>
            <p>Features from Accelerated Segment Test (Real-Time Corner Detector)</p>
        </div>

        <div class="card">
            <div id="drop-zone" class="uploader">
                <p>Click or drag image here</p>
                <input type="file" id="file-input" accept="image/*" class="hidden">
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Threshold: <span id="val-threshold">20</span></label>
                    <input type="range" id="threshold" min="1" max="100" value="20">
                </div>
                <div class="control-group">
                    <label>FAST Type</label>
                    <select id="fast-type">
                        <option value="2" selected>FAST 9_16 (OpenCV Default)</option>
                        <option value="1">FAST 7_12</option>
                        <option value="0">FAST 5_8</option>
                    </select>
                </div>
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="nonmax" checked>
                    <label for="nonmax">Non-Maximum Suppression</label>
                </div>
            </div>

            <div class="metrics">
                <span>Image Dimensions: <strong id="metric-width">0</strong>x<strong
                        id="metric-height">0</strong></span>
                <span>Keypoints: <strong id="metric-count">0</strong></span>
                <span>Latency: <strong id="metric-time">0.00</strong> ms</span>
                <span>Render Time: <strong id="metric-render">0.00</strong> ms</span>
            </div>
        </div>

        <div class="card">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="example_fast.js"></script>
</body>

</html>
