name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for CI (Build and Test)
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.ref }}
          check-name: "Build and Test"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Wait for CI (WASM Dual Build)
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.ref }}
          check-name: "WASM Dual Build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Wait for CI (Benchmarks)
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.ref }}
          check-name: "Benchmarks"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      # Both Miri legs are required checks, so a UB regression must not be
      # publishable to crates.io. These names must match the job names produced
      # by miri.yml's matrix, and miri.yml must keep its `tags: [ "v*" ]`
      # trigger — without it these steps would wait forever.
      - name: Wait for CI (Miri UB Check - baseline)
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.ref }}
          check-name: "Miri UB Check (baseline)"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Wait for CI (Miri UB Check - simd)
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.ref }}
          check-name: "Miri UB Check (simd)"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Generate Release Notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release_notes.md

      - name: Download CI Artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: ci.yml
          commit: ${{github.sha}}
          path: ./ci-artifacts

      - name: Package Artifacts
        run: |
          cd ci-artifacts
          zip -r ../wasm-package.zip wasm-package/
          zip -r ../benchmark-reports.zip benchmark-reports/
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            wasm-package.zip
            benchmark-reports.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Publish to Crates.io
        run: cargo publish --token ${{ secrets.CRATES_TOKEN }} -p purecv

  # Publishes @webarkit/purecv-wasm via npm Trusted Publishing (OIDC), not a
  # long-lived NPM_TOKEN (#129). Requires a Trusted Publisher configured on
  # npmjs.com for this package: owner `webarkit`, repository `purecv`,
  # workflow `release.yml`, no environment.
  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block for this job:
    # checkout only needs to read, and the OIDC token is what npm exchanges
    # for a short-lived publish credential (and signs provenance with).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Trusted publishing needs npm >= 11.5.1, and Node 24's bundled npm is
      # not guaranteed to be new enough (24.18.0 ships npm 10.9.4, see #129).
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@11
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error(`npm ${process.argv[1]} < 11.5.1`); process.exit(1); }' "$(npm --version)"
      - name: Build and Publish to NPM
        run: |
          npm run build:wasm
          cd crates/wasm/pkg
          npm publish --access public --provenance