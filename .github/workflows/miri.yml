name: Miri

# Undefined-behaviour verification for the `unsafe` slice reinterpretations
# backing the SIMD fast paths. Full rationale, inclusion/exclusion table and
# known coverage gaps: .agents/MIRI_PLAN.md
#
# Layout (#182): each leg (baseline, simd) runs as two nextest partitions in
# parallel, and a per-leg aggregator job carries the historical names
# "Miri UB Check (baseline)" / "Miri UB Check (simd)" that release.yml waits
# on. Only the aggregator names are load-bearing; the shard jobs can be
# renamed or re-partitioned freely.

on:
  push:
    branches: [ "main", "dev" ]
    # Tags matter here: release.yml waits on both Miri legs before publishing to
    # crates.io, and that wait would hang forever if this workflow never ran on
    # the tag. Keep in sync with ci.yml's tag trigger.
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # By default Miri injects a small random error into transcendental float ops
  # (ln/sin/cos/exp) to catch code that relies on exact results. The Box-Muller
  # transform in src/core/rng.rs uses all three, which makes
  # test_randn_determinism fail on a last-ULP difference — a false positive, not
  # UB. This flag restores deterministic float semantics.
  # NOT the issue's `-Zmiri-strict-provenance`: that is now Miri's default and
  # the flag is deprecated. See .agents/MIRI_PLAN.md §3.
  MIRIFLAGS: -Zmiri-deterministic-floats
  # Partitions per leg. Each shard job passes `slice:<k>/<N>` to nextest, so a
  # change here must be mirrored in both `partition:` matrices below.
  MIRI_PARTITIONS: 2

jobs:
  # Safe code paths plus the data_ptr/data_ptr_mut tests in src/core/tests.rs —
  # the only `unsafe` reachable without `simd`.
  shard-baseline:
    name: Miri shard (baseline, ${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    # One sequential leg took 25–30 min before #182; each shard is a few
    # minutes now (.agents/MIRI_PLAN.md §9). The budget is headroom for a cold
    # cache, not for the suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [ 1, 2 ]
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust nightly + Miri
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri

    # nextest runs every test in its own process. Miri interprets a single
    # thread, so `cargo miri test` ran the suite serially no matter how many
    # vCPUs the runner has; under nextest a shard's tests run concurrently on
    # all of them. Prebuilt binary, ~10 s.
    - name: Install cargo-nextest
      uses: taiki-e/install-action@cargo-nextest

    # One cache per leg, shared by its partitions: they build identical
    # artifacts, and Swatinem/rust-cache never overwrites an existing key, so
    # the partitions do not race on it.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: miri-baseline

    # Kept as its own step: when a nightly ships without a usable miri
    # component, the failure points at the toolchain rather than at our code.
    # Fix is to temporarily pin `dtolnay/rust-toolchain@nightly-YYYY-MM-DD`.
    - name: Build Miri sysroot
      run: cargo miri setup

    # `-p purecv` excludes crates/wasm — Miri has no wasm32 support.
    # `--no-default-features` suppresses `parallel`, which default =
    # ["std", "parallel"] would otherwise enable silently. Rayon under Miri is
    # slow and its thread support is limited; the resulting coverage gap on
    # src/core/arithm.rs (99, 248) is documented in .agents/MIRI_PLAN.md §5.
    # `--lib` skips doc-tests: two ORB examples in src/features2d/mod.rs alone
    # cost 767s under interpretation while duplicating unit-test coverage.
    # `--lib` also skips tests/ (opencv_reference_links.rs scans the filesystem,
    # which Miri isolation rejects; it runs in ci.yml). Doc-tests remain fully
    # exercised by `cargo test` in ci.yml.
    # `--partition slice:k/N` deals the test list round-robin into N buckets,
    # so every test runs in exactly one shard and no module list has to be
    # maintained here. nextest prints a per-test time, which is the source for
    # the tables in .agents/MIRI_PLAN.md §4.
    - name: Run Miri
      run: >-
        cargo miri nextest run -p purecv --lib
        --no-default-features --features std
        --partition slice:${{ matrix.partition }}/${{ env.MIRI_PARTITIONS }}

  # Reaches the real production `unsafe`: src/core/arithm.rs (119, 267) and
  # src/imgproc/derivatives.rs (346, 349). pulp is confirmed Miri-compatible:
  # this leg passes clean on both ubuntu-latest and x86_64-pc-windows-msvc.
  # See .agents/MIRI_PLAN.md §3. Steps are identical to shard-baseline apart
  # from the feature set and the cache key.
  shard-simd:
    name: Miri shard (simd, ${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [ 1, 2 ]
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust nightly + Miri
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri

    - name: Install cargo-nextest
      uses: taiki-e/install-action@cargo-nextest

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: miri-simd

    - name: Build Miri sysroot
      run: cargo miri setup

    - name: Run Miri
      run: >-
        cargo miri nextest run -p purecv --lib
        --no-default-features --features std,simd
        --partition slice:${{ matrix.partition }}/${{ env.MIRI_PARTITIONS }}

  # The two jobs below exist only to carry the names release.yml waits on.
  # They must run even when a shard fails: lewagon/wait-on-check-action accepts
  # `skipped` by default, so a plain `needs:` dependency that got skipped on a
  # red shard would let a release through. `if: always()` plus an explicit
  # check of the matrix result (which is `success` only when every partition
  # succeeded; failure, cancellation and timeouts all show up as something
  # else) turns any shard problem into a failed required check.
  baseline:
    name: Miri UB Check (baseline)
    needs: [ shard-baseline ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every baseline shard to succeed
      run: |
        echo "shard-baseline: ${{ needs.shard-baseline.result }}"
        test "${{ needs.shard-baseline.result }}" = "success"

  simd:
    name: Miri UB Check (simd)
    needs: [ shard-simd ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every simd shard to succeed
      run: |
        echo "shard-simd: ${{ needs.shard-simd.result }}"
        test "${{ needs.shard-simd.result }}" = "success"
