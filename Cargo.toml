[package]
name = "purecv"
version = "0.7.1"
authors = ["Walter Perdan <https://github.com/kalwalt>"]
edition = "2021"
rust-version = "1.88"
description = "A pure Rust, high-performance computer vision library focused on safety and portability."
license = "LGPL-2.1-or-later"
repository = "https://github.com/webarkit/purecv"
readme = "README.md"
keywords = ["computer-vision", "image-processing", "opencv", "wasm", "simd"]
categories = ["computer-vision", "science", "wasm"]

[lib]
path = "src/lib.rs"

[dependencies]
rayon = { version = "1.10", optional = true }
ndarray = { version = "0.17", optional = true }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
pulp = { version = "0.22", optional = true }
rustfft = { version = "6", optional = true }
num-complex = { version = "0.4", optional = true }
log = { version = "0.4", default-features = false }

[dev-dependencies]
image = "0.25"
criterion = "0.8"

[features]
default = ["std", "parallel"]
std = ["num-traits/std"]
# The features below require `std` until their own no_std phases land (see issue #82).
parallel = ["dep:rayon", "std"]
ndarray = ["dep:ndarray", "std"]
simd = ["dep:pulp", "std"]
fft = ["dep:rustfft", "dep:num-complex", "std"]
transforms = ["fft"]

[[bench]]
name = "arithm_bench"
path = "benches/arithm_bench.rs"
harness = false

[[bench]]
name = "imgproc_bench"
path = "benches/imgproc_bench.rs"
harness = false

[[bench]]
name = "structural_bench"
path = "benches/structural_bench.rs"
harness = false

[[bench]]
name = "dft_bench"
path = "benches/dft_bench.rs"
harness = false
required-features = ["fft"]

[[bench]]
name = "features2d_bench"
path = "benches/features2d_bench.rs"
harness = false

[[bench]]
name = "video_bench"
path = "benches/video_bench.rs"
harness = false

[[example]]
name = "dft_example"
required-features = ["fft"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"


[workspace]
members = ["crates/wasm"]
# Built separately against bare-metal targets (see the no-std CI job); keeping it
# out of the workspace lets `cargo build --workspace` stay host-only.
exclude = ["crates/no-std-smoke"]

[workspace.package]
version = "0.7.1"
authors = ["Walter Perdan <https://github.com/kalwalt>"]
edition = "2021"
description = "A pure Rust, high-performance computer vision library focused on safety and portability."
license = "LGPL-2.1-or-later"
repository = "https://github.com/webarkit/purecv"
readme = "README.md"
keywords = ["computer-vision", "image-processing", "opencv", "wasm", "simd"]
categories = ["computer-vision", "science", "wasm"]


